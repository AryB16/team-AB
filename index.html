<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticeboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="./">Noticeboard</a>
      <label class="currency">
        <span>Show prices in</span>
        <select id="currency" aria-describedby="rate-note"></select>
      </label>
    </div>
  </header>

  <div class="wrap layout">
    <aside class="post">
      <h2 class="post-heading">Post a listing</h2>
      <form id="post-form" novalidate>
        <label class="field">
          <span>Title</span>
          <input name="title" required maxlength="80" autocomplete="off" placeholder="What are you selling?">
        </label>
        <div class="field">
          <label for="price">Price</label>
          <div class="price-input">
            <input id="price" name="price" type="number" inputmode="decimal" min="0" step="0.01" required>
            <select name="currency" aria-label="Price currency"></select>
          </div>
        </div>
        <label class="field">
          <span>Category</span>
          <select name="category" required></select>
        </label>
        <p class="form-error" id="form-error" role="alert"></p>
        <button type="submit">Post listing</button>
      </form>
    </aside>

    <main>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search titles" aria-label="Search titles">
        <select id="category-filter" aria-label="Filter by category"></select>
      </div>
      <p id="rate-note" class="rate-note" aria-live="polite"></p>
      <p id="count" class="count"></p>
      <ul id="listings" class="listings"></ul>
      <p id="empty" class="empty" hidden>No listings match that. Try another category or clear the search.</p>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
