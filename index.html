<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticeboard</title>
  <meta name="description" content="Post things you want to sell, browse what's up, and see every price in your own currency.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="wrap bar-row">
      <a class="wordmark" href="./">Noticeboard</a>
      <div class="bar-actions">
        <label class="currency-pill">
          <span class="visually-hidden">Show prices in</span>
          <select id="currency" aria-describedby="rate-note"></select>
        </label>
        <button class="btn btn-primary" id="open-post" type="button">Post<span class="post-label-extra">&nbsp;a listing</span></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <h1>Buy and sell nearby</h1>
      <p class="hero-count" id="fact-count"></p>
    </section>

    <section class="browse wrap" aria-label="Listings">
      <div class="controls">
        <div class="chips" id="chips" role="radiogroup" aria-label="Category"></div>
        <div class="controls-right">
          <label class="search">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
            <input id="search" type="search" placeholder="Search titles" aria-label="Search titles">
          </label>
          <label class="sort">
            <span class="visually-hidden">Sort</span>
            <select id="sort">
              <option value="new">Newest first</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
            </select>
          </label>
        </div>
      </div>

      <p id="rate-note" class="rate-note" aria-live="polite"></p>

      <ul id="listings" class="grid"></ul>
      <p id="empty" class="empty" hidden>Nothing matches that. Try another category or search.</p>
    </section>
  </main>

  <footer class="foot wrap">
    <p>Rates by <a href="https://frankfurter.dev" rel="noopener">Frankfurter</a></p>
  </footer>

  <dialog id="post-dialog" class="sheet" aria-labelledby="post-title">
    <form id="post-form" method="dialog" novalidate>
      <div class="sheet-head">
        <h2 id="post-title">Post a listing</h2>
        <button class="icon-btn" type="button" id="close-post" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
        </button>
      </div>

      <label class="field">
        <span>Title</span>
        <input name="title" required maxlength="80" autocomplete="off" placeholder="e.g. Casio fx-991EX calculator">
      </label>

      <div class="field">
        <label for="price">Price</label>
        <div class="price-input">
          <select name="currency" aria-label="Price currency"></select>
          <input id="price" name="price" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0.00">
        </div>
      </div>

      <fieldset class="field">
        <legend>Category</legend>
        <div class="category-options" id="category-options"></div>
      </fieldset>

      <p class="form-error" id="form-error" role="alert"></p>

      <div class="sheet-actions">
        <button class="btn btn-ghost" type="button" id="cancel-post">Cancel</button>
        <button class="btn btn-primary" type="submit">Post listing</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
